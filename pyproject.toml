[project]
name = "agentguard"
version = "0.1.0"
description = "Testing, evaluation, and chaos-engineering framework for AI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AgentGuard Contributors" }
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agentguard = "agentguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
